name: Verivaro CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Node 22 domain verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Check integration and browser fixture syntax
        run: |
          set -euo pipefail
          for f in tests/integration/*.mjs tests/browser/*.mjs; do node --check "$f"; done
      - run: npm run demo
      - name: Independent PDF rendering and ZIP verification
        run: |
          set -euo pipefail
          if ! command -v pdftoppm >/dev/null || ! command -v pdftotext >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils; fi
          out="$(mktemp -d)"
          trap 'rm -rf "$out"' EXIT
          node tests/fixtures/render-verification-export.mjs "$out"
          python3 tests/fixtures/verify-rendered-export.py "$out"
