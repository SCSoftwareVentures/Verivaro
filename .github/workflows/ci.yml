name: Verivaro CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Node 22 domain verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run demo

  database:
    name: PostgreSQL 16 foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: verivaro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ephemeral-ci-only
      PGDATABASE: verivaro_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/001_foundation.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/002_scoped_ingestion.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/003_quarantine_audit.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/004_upload_status.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/005_recovery_queue.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/006_draft_extraction.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/007_document_review.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/008_evidence_graph.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/009_workflow_handover.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/010_case_rebind.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/011_financial_intelligence.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/012_index_access.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/013_original_access.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/014_contract_relations.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f tests/database/foundation.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f tests/database/scoped_ingestion.sql

      - run: psql -X -v ON_ERROR_STOP=1 -f tests/database/quarantine_audit.sql

      - run: psql -X -v ON_ERROR_STOP=1 -f tests/database/upload_status.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f tests/database/recovery_queue.sql
      - run: psql -X -v ON_ERROR_STOP=1 -f tests/database/draft_extraction.sql

  live-api:
    name: Real PostgreSQL HTTP integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: verivaro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ephemeral-ci-only
      PGDATABASE: verivaro_test
      VV_LIVE_TEST: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: |
          for migration in database/migrations/*.sql; do psql -X -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -X -v ON_ERROR_STOP=1 -f tests/database/foundation.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/database/live_logins.sql
      - run: node --experimental-strip-types --test tests/integration/live-api.test.mjs

  native-extraction:
    name: Actual Poppler and Tesseract fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng imagemagick fonts-dejavu-core
      - run: node --test tests/integration/native-extraction.test.mjs
