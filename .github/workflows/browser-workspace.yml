name: G1 browser workspace usability
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.engine == 'webkit' && 45 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Install pinned browser test tooling
        timeout-minutes: 4
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/vv-browser" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.56.1
      - name: Configure reliable WebKit system package downloads
        if: matrix.engine == 'webkit'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # The runner's EC2 package mirror timed out downloading WebKit's
          # dependency set. Use Ubuntu's official HTTPS archive when its
          # runner-provided mirror list is present. Preserve apt signatures.
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "60";' 'Acquire::https::Timeout "60";' | sudo tee /etc/apt/apt.conf.d/80-verivaro-ci >/dev/null
      - name: Install browser system dependencies
        timeout-minutes: ${{ matrix.engine == 'webkit' && 32 || 6 }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/vv-browser/node_modules/playwright/cli.js" install-deps ${{ matrix.engine }}
      - name: Install pinned browser binary
        timeout-minutes: 6
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/vv-browser/node_modules/playwright/cli.js" install ${{ matrix.engine }}
      - name: Exercise workspace in real browser engine
        timeout-minutes: 5
        env:
          VV_BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          VV_BROWSER_DIR="$RUNNER_TEMP/vv-browser" node --test tests/browser/workspace-browser.test.mjs
